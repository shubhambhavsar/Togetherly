name: Test Togetherly
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node --check server.js
      - run: node --check public/app.js
      - run: npm test
